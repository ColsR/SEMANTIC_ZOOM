<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time-Order Map for Seamless Zooming</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}" />

  <script>
    /*

</head>

<body>
<div id="setup-bar" class="expanded">
    <div id="setup-expanded">
        <div class="import-section">
        <h3>Data Import & Attributes</h3>
        <h3>Import:</h3>
          <div class="param-group">
            <form id="upload-form" enctype="multipart/form-data">
              <input type="file" id="file-input" name="file" accept=".csv, .xes" />
              <button type="button-import" id="button-import">Import Event Log</button>
            </form>
          </div>
        </div>
        <div class="attribute-section">
            <h3>Attributes</h3>
            <div id="attribute-container"></div>
        </div>
        <button id="collapse-setup">Finish Configuration</button>
    </div>

    <div id="setup-collapsed">
        <span id="file-name">No File set</span>
        <button id="edit-setup">Edit</button>
    </div>
</div>
  <center><h1>Time-Order Map for Seamless Zooming</h1></center>
  <div id="main-layout">
      <!-- Graph and slider-->
      <div id="graph-section">
          <div class="main-config">
            <div class="param-group">
            <div>
                <h3>Axis</h3>
            </div>
                <label>Y-Axis</label>
                <select name="y-axis" id="y-axis-select">
                    <option value="resource">Resource</option>
                    <option value="activity">Activity</option>
                </select>
                <label>X-Axis</label>
                <select name="x-axis" id="x-axis-select">
                    <option value="time">Time</option>
                    <option value="activity">Activity</option>
                </select>
            </div>
        </div>
        <div id="chart"></div>
          <div class="main-config">
              <div class="param-group">
              <div id="specific_zoom-container"></div>
              <div id="specific_zoom-filter-container"></div>
              <div id="specific_zoom-abstraction-container"></div>
              <button id="specific-zoom-submit">Submit</button>
              <ul id="specific-zoom-list"></ul>
                  <table id="specific-zoom-table" class="table table-borderless table-striped table-earning">
                      <thead>
                        <tr>
                            <th>Target Column</th>
                            <th>Source Column</th>
                            <th>Attribute Filter</th>
                            <th>Abstraction Function</th>
                            <th>Delete</th>
                        </tr>
                      </thead>
                      <tbody id="testBody"></tbody>
                  </table>
          </div>
              </div>

      </div>

      <!-- Graph parameters --> 
      <div id="parameters-section">

        <!-- Graph views --> 
        <!-- TODO: ENABLE SWITCH BETWEEN VIEWS WHEN FINISHED
        <div id="parameters-graph-views">
          <h3>Graph views:</h3>
          <div class="param-group">
            <div class="option-switcher" id="toggle-group-graph-view">
              <input type="radio" name="option-switcher-graph-view" id="switch-time-order" value="0" checked>
              <label for="switch-time-order">Time-Order Map</label>

              <input type="radio" name="option-switcher-graph-view" id="switch-space-order" value="1">
              <label for="switch-space-order">Space-Order Map</label>
            </div>
          </div>
        </div>-->

        <div id="parameters-graph">
          <h3>Base Abstractions:</h3>
            <!-- dynamic Abstractions -->
            <div id="abstractions-container"></div>
        </div>


        <!-- Import/Export parameters --> 
        <div id="parameters-import">

          <h3>Export:</h3>
          <div class = "param-group">
            <!--<button id="button-export" onclick="exportData()">Export SVG</button>-->
            <button id="button-export">Export SVG</button>
          </div>
        </div>
      </div>

  </div>
  
  <!-- Javascripts -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}" type="module"></script>
</body>

</html>
